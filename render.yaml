# ---------------------------------------------------------------------------
# Render blueprint — free demo topology
#
# Free Render instances support web services, Postgres and Key Value. Cron jobs
# do NOT have a free tier, so the CelesTrak refresh runs in GitHub Actions
# (.github/workflows/celestrak.yml) instead.
#
# This blueprint intentionally creates no Render database: the already-loaded
# Neon database is supplied through DATABASE_URL. The app detects Neon and uses
# the HTTPS driver, so it works from Render's network on port 443.
#
# Production upgrade: move DATABASE_URL to a paid Render Postgres instance,
# move the web service to a paid plan (no spin-down), and either add a paid cron
# service or keep the GitHub Actions schedule.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: lost-in-space
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: NASA_API_KEY
        sync: false
