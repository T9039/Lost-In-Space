# Draft CI workflow.
# To enable it, copy this file to `.github/workflows/ci.yml`.
# GitHub rejects workflow files from tokens without the `workflow` scope;
# run `gh auth refresh -s workflow` first, or add the file through the web UI.

name: CI

on:
  push:
    branches: [main, Frontend]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  etl:
    name: ETL tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            etl/requirements.txt
            etl/requirements-dev.txt
      - run: pip install -r etl/requirements.txt -r etl/requirements-dev.txt
      - run: python -m pytest etl/tests -q

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v3
        with:
          typst-version: "0.15.1"
      - name: Compile the technical document
        working-directory: docs/technical
        run: typst compile main.typ
