name: CelesTrak refresh

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celestrak-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh GP element sets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      - name: Refresh from CelesTrak
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m etl.celestrak_refresh
